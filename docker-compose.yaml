services:
  backend:
    environment:
      - PYTHONUNBUFFERED=1
    build:
      context: .
      dockerfile: backend/Dockerfile
    expose:
      - "8000"
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  inference:
    environment:
      - PYTHONUNBUFFERED=1
    build:
      context: .
      dockerfile: inference/Dockerfile
      args:
        TORCH_BACKEND: cpu
    depends_on:
      - redis
    volumes:
      - ./data:/app/inference/data
