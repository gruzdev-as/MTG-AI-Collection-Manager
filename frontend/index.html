<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="error-log" style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; font-size: 16px; position: fixed; top: 0; left: 0; z-index: 9999; background: white; width: 100vw; height: 100vh; display: none;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.getElementById('error-log').style.display = 'block';
        document.getElementById('error-log').innerText += 'ERROR: ' + message + '\n';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-log').style.display = 'block';
        document.getElementById('error-log').innerText += 'PROMISE REJECTION: ' + event.reason + '\n';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
