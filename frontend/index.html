<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MTG Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Camera View -->
  <div id="camera-view" class="view active">
    <div class="camera-wrapper" id="camera-wrapper">
      <video id="camera-feed" autoplay playsinline muted></video>
      <canvas id="overlay-canvas"></canvas>

      <div class="camera-hud-top">
        <span class="hud-badge" id="resolution-badge">--</span>
        <button class="icon-btn" id="switch-camera-btn" title="Switch camera">
          <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
            <circle cx="12" cy="13" r="3"/>
          </svg>
        </button>
      </div>

      <div class="guide-text" id="guide-text">Place the card inside the frame</div>
    </div>

    <div class="controls-bar">
      <button class="capture-btn" id="capture-btn">
        <span class="capture-btn-ring"></span>
        <span class="capture-btn-inner"></span>
      </button>
    </div>
  </div>

  <!-- Preview View (shown after capture) -->
  <div id="preview-view" class="view">
    <div class="preview-wrapper">
      <canvas id="preview-canvas"></canvas>
    </div>

    <div class="preview-actions">
      <button class="action-btn secondary" id="retake-btn">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
        </svg>
        Retake
      </button>
      <button class="action-btn primary" id="send-btn">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
        Send
      </button>
    </div>
  </div>

  <!-- Permission / Error View -->
  <div id="error-view" class="view">
    <div class="error-card">
      <div class="error-icon">
        <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z"/>
        </svg>
      </div>
      <h2>Camera Access Required</h2>
      <p id="error-message">Please allow camera access to scan your MTG cards.</p>
      <button class="action-btn primary" id="retry-btn">Try Again</button>
    </div>
  </div>

  <!-- Flash overlay for capture feedback -->
  <div id="flash-overlay" class="flash-overlay"></div>

  <script src="app.js"></script>
</body>
</html>
